[package]
name = "mealplan-server"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
async-stream = "0.3.6"
chrono = "0.4.45"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
uuid = { version = "1.29.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tower-http = { version = "0.7.1", features = ["fs"] }
dotenvy = "0.15.7"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
